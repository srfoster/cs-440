  **What is "artificial intelligence"?**

  **Level 0**  Give a brief history of AI, from its philosophical roots to large language models.  Discuss how the word "AI" has changed over time, and how it is used in different contexts today.  

  **Level 1**  This course has three chapters: Search, Reasoning, and Learning.  Discuss each of these ideas, and unpack them into their subtopics.  For each subtopic, give a brief description and example problem, and say how it matters in the modern context (either in AI or in the larger context of computer science). 

  **Level 2**  In a language of your choice, implement a simple system with an agent and an environment.  Run the system to demonstrate what the agent does.
  
  **Level 3**  For each of the topics in the course, discuss how they could be used to improve the intelligence of the agent you implemented and what changes in the environment would necessitate those improvements.  
